openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Hamle Elementary School Student Information System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: students
    description: Student management
  - name: reports
    description: Grade and assessment reports
  - name: attendance
    description: Attendance tracking
  - name: users
    description: User management (admin only)
  - name: announcements
    description: School announcements

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change authenticated user's password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Incorrect current password or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /students:
    get:
      operationId: getStudents
      tags: [students]
      summary: Get students (filtered by role)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
    post:
      operationId: createStudent
      tags: [students]
      summary: Create a new student (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStudentRequest"
      responses:
        "201":
          description: Student created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /students/{id}:
    get:
      operationId: getStudent
      tags: [students]
      summary: Get a single student
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Student detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateStudent
      tags: [students]
      summary: Update a student (admin/teacher)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentRequest"
      responses:
        "200":
          description: Student updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteStudent
      tags: [students]
      summary: Delete a student (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Student deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports:
    get:
      operationId: getReports
      tags: [reports]
      summary: Get all reports (role-filtered)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      operationId: createReport
      tags: [reports]
      summary: Create a new report (teacher/admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
      responses:
        "201":
          description: Report created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/{id}:
    put:
      operationId: updateReport
      tags: [reports]
      summary: Update a report (teacher/admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReportRequest"
      responses:
        "200":
          description: Report updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteReport
      tags: [reports]
      summary: Delete a report (teacher/admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Report deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /reports/student/{studentId}:
    get:
      operationId: getStudentReports
      tags: [reports]
      summary: Get reports for a specific student
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Student reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"

  /attendance:
    get:
      operationId: getAttendance
      tags: [attendance]
      summary: Get attendance records (role-filtered)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attendance"
    post:
      operationId: createAttendance
      tags: [attendance]
      summary: Record attendance (teacher/admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttendanceRequest"
      responses:
        "201":
          description: Attendance recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"
        "409":
          description: Attendance already exists for date
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /attendance/{id}:
    put:
      operationId: updateAttendance
      tags: [attendance]
      summary: Update attendance record (teacher/admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAttendanceRequest"
      responses:
        "200":
          description: Attendance record updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendance"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAttendance
      tags: [attendance]
      summary: Delete attendance record (teacher/admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Attendance record deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /attendance/student/{studentId}:
    get:
      operationId: getStudentAttendance
      tags: [attendance]
      summary: Get attendance for a specific student
      security:
        - bearerAuth: []
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Student attendance
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attendance"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [students]
      summary: Get dashboard summary stats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /users:
    get:
      operationId: getUsers
      tags: [users]
      summary: List all users (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [teacher, parent]
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserDetail"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new teacher or parent (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a single user (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateUser
      tags: [users]
      summary: Update a user (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: User deleted
        "403":
          description: Cannot delete yourself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /announcements:
    get:
      operationId: getAnnouncements
      tags: [announcements]
      summary: Get announcements (role-filtered)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
    post:
      operationId: createAnnouncement
      tags: [announcements]
      summary: Create a new announcement (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnnouncementRequest"
      responses:
        "201":
          description: Announcement created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"

  /announcements/{id}:
    put:
      operationId: updateAnnouncement
      tags: [announcements]
      summary: Update an announcement (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAnnouncementRequest"
      responses:
        "200":
          description: Announcement updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
    delete:
      operationId: deleteAnnouncement
      tags: [announcements]
      summary: Delete an announcement (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Announcement deleted

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    ChangePasswordRequest:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
      required:
        - currentPassword
        - newPassword

    AuthLoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    User:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, teacher, parent]
      required:
        - id
        - name
        - email
        - role

    UserDetail:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, teacher, parent]
        studentCount:
          type: integer
      required:
        - id
        - name
        - email
        - role
        - studentCount

    CreateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
          enum: [teacher, parent]
      required:
        - name
        - email
        - password
        - role

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          nullable: true
        role:
          type: string
          enum: [teacher, parent]
      required:
        - name
        - email
        - role

    Address:
      type: object
      properties:
        region:
          type: string
        zone:
          type: string
        kebele:
          type: string
        houseNo:
          type: string
      required:
        - region
        - zone
        - kebele
        - houseNo

    Student:
      type: object
      properties:
        id:
          type: string
        studentNo:
          type: string
        firstName:
          type: string
          pattern: '^[a-zA-Z\s]+$'
        lastName:
          type: string
          pattern: '^[a-zA-Z\s]+$'
        grade:
          type: string
        dateOfBirth:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        gender:
          type: string
          enum: [male, female]
        address:
          $ref: '#/components/schemas/Address'
          nullable: true
        faydaId:
          type: string
          pattern: '^[0-9]{12}$'
          nullable: true
        enrollmentStatus:
          type: string
          enum: [active, inactive, withdrawn, transferred, graduated]
        medicalInfo:
          type: string
          nullable: true
        emergencyContact:
          type: string
          nullable: true
        parentId:
          type: string
          nullable: true
        teacherId:
          type: string
          nullable: true
        parentName:
          type: string
          nullable: true
        teacherName:
          type: string
          nullable: true
        attendanceRate:
          type: number
          nullable: true
        averageScore:
          type: number
          nullable: true
      required:
        - id
        - studentNo
        - firstName
        - lastName
        - grade
        - dateOfBirth
        - gender
        - enrollmentStatus

    CreateStudentRequest:
      type: object
      properties:
        firstName:
          type: string
          pattern: '^[a-zA-Z\s]+$'
        lastName:
          type: string
          pattern: '^[a-zA-Z\s]+$'
        grade:
          type: string
        dateOfBirth:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        gender:
          type: string
          enum: [male, female]
        address:
          $ref: '#/components/schemas/Address'
          nullable: true
        faydaId:
          type: string
          pattern: '^[0-9]{12}$'
          nullable: true
        enrollmentStatus:
          type: string
          enum: [active, inactive, withdrawn, transferred, graduated]
        medicalInfo:
          type: string
          nullable: true
        emergencyContact:
          type: string
          nullable: true
        parentId:
          type: string
          nullable: true
        teacherId:
          type: string
          nullable: true
      required:
        - firstName
        - lastName
        - grade
        - dateOfBirth

    UpdateStudentRequest:
      type: object
      properties:
        firstName:
          type: string
          pattern: '^[a-zA-Z\s]+$'
        lastName:
          type: string
          pattern: '^[a-zA-Z\s]+$'
        grade:
          type: string
        dateOfBirth:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        gender:
          type: string
          enum: [male, female]
        address:
          $ref: '#/components/schemas/Address'
          nullable: true
        faydaId:
          type: string
          pattern: '^[0-9]{12}$'
          nullable: true
        enrollmentStatus:
          type: string
          enum: [active, inactive, withdrawn, transferred, graduated]
        medicalInfo:
          type: string
          nullable: true
        emergencyContact:
          type: string
          nullable: true
        parentId:
          type: string
          nullable: true
        teacherId:
          type: string
          nullable: true

    Report:
      type: object
      properties:
        id:
          type: string
        studentId:
          type: string
        studentName:
          type: string
        subject:
          type: string
        score:
          type: number
          nullable: true
        midExam:
          type: number
          nullable: true
        tests:
          type: number
          nullable: true
        continuousAssessment:
          type: number
          nullable: true
        finalExam:
          type: number
          nullable: true
        type:
          type: string
          enum: [grade, assessment, attendance]
        date:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        teacherId:
          type: string
        teacherName:
          type: string
        notes:
          type: string
          nullable: true
        term:
          type: string
          nullable: true
        status:
          type: string
          enum: [Pass, Fail]
          nullable: true
      required:
        - id
        - studentId
        - studentName
        - subject
        - type
        - date
        - teacherId
        - teacherName

    CreateReportRequest:
      type: object
      properties:
        studentId:
          type: string
        subject:
          type: string
        score:
          type: number
          nullable: true
        midExam:
          type: number
          nullable: true
        tests:
          type: number
          nullable: true
        continuousAssessment:
          type: number
          nullable: true
        finalExam:
          type: number
          nullable: true
        type:
          type: string
          enum: [grade, assessment, attendance]
        date:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        notes:
          type: string
          nullable: true
        term:
          type: string
          nullable: true
      required:
        - studentId
        - subject
        - type
        - date

    UpdateReportRequest:
      type: object
      properties:
        subject:
          type: string
        score:
          type: number
          nullable: true
        midExam:
          type: number
          nullable: true
        tests:
          type: number
          nullable: true
        continuousAssessment:
          type: number
          nullable: true
        finalExam:
          type: number
          nullable: true
        type:
          type: string
          enum: [grade, assessment, attendance]
        date:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        notes:
          type: string
          nullable: true
        term:
          type: string
          nullable: true

    Attendance:
      type: object
      properties:
        id:
          type: string
        studentId:
          type: string
        studentName:
          type: string
        date:
          type: string
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
        status:
          type: string
          enum: [present, absent, late]
        teacherId:
          type: string
        notes:
          type: string
          nullable: true
      required:
        - id
        - studentId
        - studentName
        - date
        - status
        - teacherId

    CreateAttendanceRequest:
      type: object
      properties:
        studentId:
          type: string
        date:
